name: Android companion

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [master, 'feat/**']
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      # The APK must be signed with the repo's shared debug keystore
      # (see app/build.gradle.kts), or the phone refuses to install it
      # over the previous build. Fail the job here — not on the phone —
      # if the signature ever drifts again. The keytool grep matches
      # "SHA256:" with its colon, so it cannot also match the
      # "Signature algorithm name: SHA256withRSA" line.
      - name: Verify APK signature matches the shared debug keystore
        working-directory: android
        run: |
          key_cert=$(keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "shared keystore: $key_cert"
          apksigner_bin=$(command -v apksigner || ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          apk_cert=$("$apksigner_bin" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep "SHA-256 digest:" | awk '{print $NF}')
          echo "app-debug.apk: $apk_cert"
          [ "$apk_cert" = "$key_cert" ] || { echo "signature mismatch in app-debug.apk"; exit 1; }
      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: android/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
      - name: Lint
        working-directory: android
        run: gradle --no-daemon lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emrg-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
