name: Companion security tests

on:
  push:
    branches: ["feat/**"]
    paths:
      - "emrg/server/companion_*.py"
      - "tests/test_companion_*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/companion-security.yml"
  pull_request:
    paths:
      - "emrg/server/companion_*.py"
      - "tests/test_companion_*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/companion-security.yml"
  workflow_dispatch:

concurrency:
  group: companion-security-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  companion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Sync project dependencies
        run: uv sync
      - name: Generate platform requirements locks
        if: github.event_name == 'push'
        run: |
          uv pip compile pyproject.toml --python-version 3.13 --python-platform x86_64-pc-windows-msvc -o packaging/requirements-windows-x64.lock
          uv pip compile pyproject.toml --python-version 3.13 --python-platform x86_64-unknown-linux-gnu -o packaging/requirements-linux-x86_64.lock
          uv pip compile pyproject.toml --python-version 3.13 --python-platform aarch64-unknown-linux-gnu -o packaging/requirements-linux-aarch64.lock
          uv pip compile pyproject.toml --python-version 3.13 --python-platform aarch64-apple-darwin -o packaging/requirements-macos-arm64.lock
      - name: Commit generated lockfile
        if: github.event_name == 'push' && matrix.os == 'ubuntu-latest'
        run: |
          if git diff --quiet -- uv.lock packaging/requirements-*.lock; then
            echo "Dependency lock files are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock packaging/requirements-*.lock
          git commit -m "build: update dependency lockfiles"
          git push origin HEAD:${{ github.ref_name }}
      - name: Upload resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock-${{ matrix.os }}
          path: uv.lock
          if-no-files-found: error
      - name: Companion host security tests
        run: uv run pytest -v tests/test_companion_auth.py tests/test_companion_credentials.py tests/test_companion_host_service.py tests/test_companion_pairing.py tests/test_companion_pairing_descriptor.py tests/test_companion_protocol.py tests/test_companion_tls.py tests/test_companion_tls_identity.py
