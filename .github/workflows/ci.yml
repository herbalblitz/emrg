name: CI

on:
  push:
    branches: [feat/termux-local, main]
  pull_request:
    # No `branches` filter on purpose: a base branch can be any branch.
    # Filtering to this branch gave a stacked PR (base = another branch)
    # zero check runs -- the upstream guard test_test_workflow_covers_pr_bases
    # fails the workflow otherwise.

env:
  EMRG_VERSION: 0.3.63

jobs:
  lint-and-python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Sync dependencies (gateway extra)
        run: uv sync --extra gateway --frozen
      - name: Lint the gateway (unchanged core must stay 0-diff)
        run: |
          git diff --quiet upstream-v0.3.63-a7568dcf -- emrg/ ':!emrg/gateway' \
            && echo "core emrg/ unchanged" \
            || { echo "ERROR: emrg/ outside emrg/gateway/ changed"; exit 1; }
      - name: Run gateway tests
        run: uv run pytest tests/gateway -q
      - name: Run index-derived guards
        run: |
          git add emrg/gateway pyproject.toml tests/gateway
          uv run pytest tests/test_the_index_derived_scans_reach_new_files.py tests/test_conflict_markers.py tests/test_cmd_crlf.py tests/test_no_duplicate_sources.py -q

  android:
    needs: lint-and-python-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 35
          target: android-35
          build-tools: "35.0.0"
          packages: ''  # setup-android v3 defaults to "tools platform-tools"; "tools" no longer exists
      - name: Make gradlew executable
        run: chmod +x android/gradlew
      - name: Kotlin unit tests
        run: ./gradlew :app:testDebugUnitTest
        working-directory: android
      - name: Debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: android
      - name: Release APK / AAB
        env:
          EMRG_KEYSTORE_FILE: ${{ secrets.EMRG_KEYSTORE_FILE }}
          EMRG_KEYSTORE_PASSWORD: ${{ secrets.EMRG_KEYSTORE_PASSWORD }}
          EMRG_KEY_ALIAS: ${{ secrets.EMRG_KEY_ALIAS }}
          EMRG_KEY_PASSWORD: ${{ secrets.EMRG_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease
        working-directory: android
      # The APKs must be signed with the repo's shared debug keystore
      # (see app/build.gradle.kts), or the phone refuses to install them
      # over the previous build. Fail the job here — not on the phone —
      # if the signature ever drifts again.
      - name: Verify APK signatures match the shared debug keystore
        run: |
          key_cert=$(keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256:" | awk '{print $2}' | tr -d ':' | tr 'A-Z' 'a-z')
          echo "shared keystore: $key_cert"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release.apk; do
            apk_cert=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk" | grep "SHA-256" | awk '{print $NF}')
            echo "$apk: $apk_cert"
            [ "$apk_cert" = "$key_cert" ] || { echo "signature mismatch in $apk"; exit 1; }
          done
        working-directory: android
      - name: Publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

  windows:
    needs: lint-and-python-tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Node (Electron)
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install uv
        shell: pwsh
        run: |
          iwr -useb https://astral.sh/uv/install.ps1 | iex
      - name: Sync Python dependencies
        shell: pwsh
        run: uv sync --extra gateway --frozen
      - name: Install GUI dependencies
        shell: pwsh
        run: |
          cd emrg/gui
          npm ci
      - name: Build React renderer
        shell: pwsh
        run: |
          cd emrg/gui/renderer
          npm ci
          npm run build
      - name: Build Windows EXE
        shell: pwsh
        run: |
          cd emrg/gui
          npm run dist
      - name: Publish EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: emrg/gui/dist/**/*.exe
          retention-days: 30
